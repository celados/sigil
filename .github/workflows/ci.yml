name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          # argc v7 uses Bun's current JSON5 runtime API; pinning an old Bun
          # version turns valid input parsing into a runtime compatibility gap.
          bun-version: latest
      - run: bun install
      - run: bun --version
      - run: bun run check
      - run: bun run build
